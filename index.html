<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - DetectPro AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#f4f7fb', 100: '#e1eaf4', 500: '#2563eb', 600: '#1d4ed8', 900: '#1e3a8a' },
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f8fafc;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .dark .glass-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .saved-item:hover .delete-btn {
            color: #ef4444;
        }

        .saved-item:hover {
            border-color: #2563eb;
        }
    </style>
</head>

<body
    class="text-slate-900 dark:bg-slate-900 dark:text-white min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-blue-500/10 rounded-full blur-[120px]"></div>
        <div class="absolute top-1/2 -right-24 w-80 h-80 bg-emerald-500/10 rounded-full blur-[100px]"></div>
    </div>

    <div class="max-w-md w-full z-10">
        <div class="text-center mb-8">
            <div
                class="w-20 h-20 rounded-[2rem] bg-blue-600 flex items-center justify-center text-white text-4xl shadow-2xl shadow-blue-600/40 mx-auto mb-6">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="text-4xl font-black tracking-tight mb-2">DetectPro AI</h1>
            <p class="text-slate-500 dark:text-slate-400 font-medium">Academic Integrity, Redefined.</p>
        </div>

        <div class="glass-card p-10 rounded-[3rem] shadow-2xl">
            <h2 class="text-2xl font-black mb-1">Sign In</h2>
            <p class="text-slate-500 dark:text-slate-400 text-sm mb-8 font-medium">
                Welcome back! Enter your credentials below.<br>
                <span class="text-blue-500 font-bold">Only @gmail.com or @university.edu emails are accepted.</span>
            </p>

            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-xs font-black uppercase tracking-widest text-slate-400 mb-2 pl-1">Academic
                        Email</label>
                    <input type="email" id="email" required
                        class="w-full px-6 py-4 bg-slate-50 dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 rounded-2xl outline-none focus:border-blue-500 transition-all font-bold"
                        placeholder="e.g., name@university.edu">
                </div>
                <div>
                    <label
                        class="block text-xs font-black uppercase tracking-widest text-slate-400 mb-2 pl-1">Password</label>
                    <input type="password" id="password" required
                        class="w-full px-6 py-4 bg-slate-50 dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 rounded-2xl outline-none focus:border-blue-500 transition-all font-bold"
                        placeholder="••••••••">
                </div>

                <div id="login-error"
                    class="hidden text-sm text-red-500 font-bold text-center bg-red-50 dark:bg-red-900/20 p-3 rounded-xl">
                </div>

                <button type="submit"
                    class="w-full py-5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-black shadow-xl shadow-blue-600/30 transition-all transform hover:-translate-y-1 active:scale-95 text-lg">
                    Secure Log In <i class="fa-solid fa-arrow-right ml-2 text-sm"></i>
                </button>
            </form>

            <div class="mt-5 text-center">
                <p class="text-sm text-slate-500 dark:text-slate-400 font-bold">
                    Don't have an account?
                    <a href="signup.html"
                        class="text-blue-600 hover:text-blue-700 dark:text-blue-400 transition-colors">Sign up here</a>
                </p>
            </div>

            <!-- Saved Accounts Section -->
            <div id="saved-accounts-container" class="hidden mt-6 pt-6 border-t border-slate-100 dark:border-slate-700">
                <h3 class="text-xs font-black uppercase tracking-widest text-slate-400 mb-3 text-center">
                    <i class="fa-solid fa-users mr-1"></i> Saved Accounts — click to autofill
                </h3>
                <ul id="saved-accounts-list" class="space-y-2"></ul>
            </div>

            <div class="mt-6 pt-6 border-t border-slate-100 dark:border-slate-700 text-center">
                <button onclick="document.documentElement.classList.toggle('dark')"
                    class="text-slate-400 hover:text-blue-600 transition-colors text-sm">
                    <i class="fa-solid fa-circle-half-stroke mr-1"></i> Switch Theme
                </button>
            </div>
        </div>

        <p class="text-center mt-8 text-xs font-bold text-slate-400 uppercase tracking-widest">
            &copy; 2026 DetectPro AI Academic Systems
        </p>
    </div>

    <script>
        // ── Redirect if already logged in ──
        if (localStorage.getItem('detectpro_user')) {
            window.location.href = 'dashboard.html';
        }

        // ── Render saved accounts on page load ──
        function renderSavedAccounts() {
            const users = JSON.parse(localStorage.getItem('detectpro_users') || '[]');
            const container = document.getElementById('saved-accounts-container');
            const list = document.getElementById('saved-accounts-list');

            if (users.length === 0) {
                container.classList.add('hidden');
                return;
            }

            container.classList.remove('hidden');
            list.innerHTML = '';

            users.forEach(user => {
                const li = document.createElement('li');
                li.className = 'saved-item flex items-center justify-between bg-slate-50 dark:bg-slate-800 p-3 rounded-xl border-2 border-slate-100 dark:border-slate-700 cursor-pointer transition-colors';

                li.innerHTML = `
                    <div class="flex items-center gap-3 flex-1 overflow-hidden" onclick="autofillEmail('${user.email}')">
                        <div class="w-9 h-9 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-black text-sm flex-shrink-0">
                            ${user.name.charAt(0).toUpperCase()}
                        </div>
                        <div class="overflow-hidden">
                            <p class="text-xs font-bold text-slate-800 dark:text-white truncate">${user.name}</p>
                            <p class="text-[10px] text-slate-500 dark:text-slate-400 truncate">${user.email}</p>
                        </div>
                    </div>
                    <button
                        onclick="removeSavedAccount('${user.email}')"
                        title="Remove saved account"
                        class="delete-btn ml-2 w-7 h-7 rounded-full flex items-center justify-center text-slate-300 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 transition-colors flex-shrink-0">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                `;

                list.appendChild(li);
            });
        }

        function autofillEmail(email) {
            document.getElementById('email').value = email;
            document.getElementById('password').focus();
        }

        function removeSavedAccount(email) {
            if (!confirm('Remove this saved account from the list?')) return;
            let users = JSON.parse(localStorage.getItem('detectpro_users') || '[]');
            users = users.filter(u => u.email !== email);
            localStorage.setItem('detectpro_users', JSON.stringify(users));
            renderSavedAccounts();
        }

        // ── Login form submit ──
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');

            // Email domain validation
            if (!email.endsWith('@university.edu') && !email.endsWith('@gmail.com')) {
                errorEl.textContent = 'Invalid email! Only @university.edu or @gmail.com addresses are accepted.';
                errorEl.classList.remove('hidden');
                return;
            }

            errorEl.classList.add('hidden');

            const users = JSON.parse(localStorage.getItem('detectpro_users') || '[]');
            const foundUser = users.find(u => u.email === email && u.password === password);

            if (foundUser) {
                const sessionUser = { name: foundUser.name, email: foundUser.email };
                localStorage.setItem('detectpro_user', JSON.stringify(sessionUser));
                window.location.href = 'dashboard.html';
            } else {
                errorEl.textContent = 'Incorrect email or password. Please sign up first if you don\'t have an account.';
                errorEl.classList.remove('hidden');
            }
        });

        // ── Init ──
        renderSavedAccounts();
    </script>
</body>

</html>
