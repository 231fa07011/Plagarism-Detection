<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - DetectPro AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#f4f7fb', 100: '#e1eaf4', 500: '#2563eb', 600: '#1d4ed8', 900: '#1e3a8a' },
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .dark .glass-card { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="text-slate-900 dark:bg-slate-900 dark:text-white min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-blue-500/10 rounded-full blur-[120px]"></div>
        <div class="absolute top-1/2 -right-24 w-80 h-80 bg-emerald-500/10 rounded-full blur-[100px]"></div>
    </div>

    <div class="max-w-md w-full z-10 my-8">
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-[1.5rem] bg-blue-600 flex items-center justify-center text-white text-3xl shadow-2xl shadow-blue-600/40 mx-auto mb-4">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 class="text-3xl font-black tracking-tight mb-2">Join DetectPro AI</h1>
            <p class="text-slate-500 dark:text-slate-400 font-medium">Empower Your Academic Journey.</p>
        </div>

        <div class="glass-card p-10 rounded-[3rem] shadow-2xl">
            <h2 class="text-2xl font-black mb-1">Create Account</h2>
            <p class="text-slate-500 dark:text-slate-400 text-sm mb-8 font-medium">
                Register to start detecting plagiarism instantly.<br>
                <span class="text-blue-500 font-bold">Only @gmail.com or @university.edu emails are accepted.</span>
            </p>

            <form id="signup-form" class="space-y-5">
                <div>
                    <label class="block text-xs font-black uppercase tracking-widest text-slate-400 mb-2 pl-1">Full Name</label>
                    <input type="text" id="name" required
                        class="w-full px-6 py-4 bg-slate-50 dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 rounded-2xl outline-none focus:border-blue-500 transition-all font-bold"
                        placeholder="e.g. Professor Smith">
                </div>
                <div>
                    <label class="block text-xs font-black uppercase tracking-widest text-slate-400 mb-2 pl-1">Academic Email</label>
                    <input type="email" id="email" required
                        class="w-full px-6 py-4 bg-slate-50 dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 rounded-2xl outline-none focus:border-blue-500 transition-all font-bold"
                        placeholder="name@university.edu or name@gmail.com">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-black uppercase tracking-widest text-slate-400 mb-2 pl-1">Password</label>
                        <input type="password" id="password" required
                            class="w-full px-5 py-4 bg-slate-50 dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 rounded-2xl outline-none focus:border-blue-500 transition-all font-bold"
                            placeholder="Min. 6 chars">
                    </div>
                    <div>
                        <label class="block text-xs font-black uppercase tracking-widest text-slate-400 mb-2 pl-1">Confirm</label>
                        <input type="password" id="confirm_password" required
                            class="w-full px-5 py-4 bg-slate-50 dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 rounded-2xl outline-none focus:border-blue-500 transition-all font-bold"
                            placeholder="Repeat">
                    </div>
                </div>

                <!-- Error / Success messages -->
                <div id="signup-error" class="hidden text-sm text-red-500 font-bold text-center bg-red-50 dark:bg-red-900/20 p-3 rounded-xl"></div>

                <button type="submit"
                    class="w-full py-5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-black shadow-xl shadow-blue-600/30 transition-all transform hover:-translate-y-1 active:scale-95 text-lg mt-2">
                    Create Account <i class="fa-solid fa-arrow-right ml-2 text-sm"></i>
                </button>
            </form>

            <div class="mt-5 text-center">
                <p class="text-sm text-slate-500 dark:text-slate-400 font-bold">
                    Already have an account?
                    <a href="index.html" class="text-blue-600 hover:text-blue-700 dark:text-blue-400 transition-colors">Sign in here</a>
                </p>
            </div>

            <div class="mt-6 pt-6 border-t border-slate-100 dark:border-slate-700 text-center">
                <button onclick="document.documentElement.classList.toggle('dark')" class="text-slate-400 hover:text-blue-600 transition-colors text-sm">
                    <i class="fa-solid fa-circle-half-stroke mr-1"></i> Switch Theme
                </button>
            </div>
        </div>

        <p class="text-center mt-8 text-xs font-bold text-slate-400 uppercase tracking-widest">
            &copy; 2026 DetectPro AI Academic Systems
        </p>
    </div>

    <script>
        // ── Redirect if already logged in ──
        if (localStorage.getItem('detectpro_user')) {
            window.location.href = 'dashboard.html';
        }

        // ── Signup form submit ──
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const name     = document.getElementById('name').value.trim();
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm  = document.getElementById('confirm_password').value;
            const errorEl  = document.getElementById('signup-error');

            // Validate name
            if (name.length < 2) {
                errorEl.textContent = 'Please enter your full name (at least 2 characters).';
                errorEl.classList.remove('hidden');
                return;
            }

            // Validate email domain
            if (!email.endsWith('@university.edu') && !email.endsWith('@gmail.com')) {
                errorEl.textContent = 'Invalid email! Only @university.edu or @gmail.com addresses are accepted.';
                errorEl.classList.remove('hidden');
                return;
            }

            // Validate password length
            if (password.length < 6) {
                errorEl.textContent = 'Password must be at least 6 characters long.';
                errorEl.classList.remove('hidden');
                return;
            }

            // Validate password match
            if (password !== confirm) {
                errorEl.textContent = 'Passwords do not match! Please re-enter.';
                errorEl.classList.remove('hidden');
                return;
            }

            errorEl.classList.add('hidden');

            // Check if account already exists
            let users = JSON.parse(localStorage.getItem('detectpro_users') || '[]');
            if (users.find(u => u.email === email)) {
                errorEl.textContent = 'An account with this email already exists. Please sign in instead.';
                errorEl.classList.remove('hidden');
                return;
            }

            // Save new user
            users.push({ name, email, password });
            localStorage.setItem('detectpro_users', JSON.stringify(users));

            // Auto-login
            localStorage.setItem('detectpro_user', JSON.stringify({ name, email }));

            alert('Account created successfully! Welcome to DetectPro AI, ' + name + '!');
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
